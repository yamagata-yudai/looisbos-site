<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groceries — Recommended | Looisbos</title>
<meta name="description" content="Looisbos 4th EP『Groceries』に寄せられたアーティストからの推薦コメント">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0c0d;
  --ink:#f4f1ea;
  --ink-dim:#a8a49a;
  --line:rgba(244,241,234,0.18);
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
  min-height:100vh;
}
.page-header{
  max-width:720px;
  margin:0 auto;
  padding:5rem 1.5rem 2.5rem;
  text-align:center;
}
.logo{
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-size:1.4rem;
  letter-spacing:0.04em;
  color:var(--ink-dim);
  text-decoration:none;
}
.eyebrow{
  margin-top:2.2rem;
  font-size:0.72rem;
  letter-spacing:0.28em;
  color:var(--ink-dim);
  text-transform:uppercase;
}
.headline{
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-weight:500;
  font-size:clamp(2.6rem,7vw,4.2rem);
  margin-top:0.6rem;
}
.sub{
  margin-top:1rem;
  font-size:0.9rem;
  color:var(--ink-dim);
  line-height:1.8;
}
.gallery{
  max-width:1080px;
  margin:0 auto;
  padding:0 0 6rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4rem;
}
.card{
  width:100%;
  max-width:640px;
  opacity:0;
  transform:translateY(24px);
  transition:opacity 0.8s ease, transform 0.8s ease;
}
.card.is-visible{
  opacity:1;
  transform:translateY(0);
}
.card img{
  display:block;
  width:100%;
  height:auto;
  border:1px solid var(--line);
}
.divider{
  width:100%;
  max-width:1080px;
  margin:0 auto;
  border:none;
  border-top:1px solid var(--line);
}
.page-footer{
  max-width:720px;
  margin:0 auto;
  padding:0 1.5rem 5rem;
  text-align:center;
}
.back-link{
  display:inline-block;
  font-size:0.8rem;
  letter-spacing:0.08em;
  color:var(--ink-dim);
  text-decoration:none;
  border:1px solid var(--line);
  padding:0.7rem 1.6rem;
  transition:color 0.2s, border-color 0.2s;
}
.back-link:hover{
  color:var(--ink);
  border-color:var(--ink);
}
</style>
</head>
<body>

<header class="page-header">
  <a href="index.html" class="logo">Looisbos</a>
  <div class="eyebrow">4th EP · 2026 · 5 Tracks</div>
  <h1 class="headline">Groceries</h1>
  <p class="sub">バンド自身のライナーノーツと、『Groceries』に寄せられたアーティストたちからの推薦コメント。</p>
</header>

<hr class="divider">

<section class="gallery">
  <figure class="card">
    <img src="assets/images/comments/Looisbos_Groceries_gatta_1080.jpeg" alt="Looisbos Dr&Vo Gatta による『Groceries』セルフライナーノーツ" loading="lazy" width="1080" height="1080">
  </figure>
  <figure class="card">
    <img src="assets/images/comments/Looisbos_Groceries_yanagisawa_1080.png" alt="柳澤豊(MONO NO AWARE / Jurassic Boys・Drums)のコメント" loading="lazy" width="2160" height="2160">
  </figure>
  <figure class="card">
    <img src="assets/images/comments/Looisbos_Groceries_hidematt_1080.png" alt="Hide Matt(Strobolights・Guitar & Vocal)のコメント" loading="lazy" width="2160" height="2160">
  </figure>
  <figure class="card">
    <img src="assets/images/comments/Looisbos_Groceries_takuchan_1080.png" alt="takuchan(NYAI・Guitar & Vocal / LIVE HOUSE 秘密・店長)のコメント" loading="lazy" width="2160" height="2160">
  </figure>
  <figure class="card">
    <img src="assets/images/comments/Looisbos_Groceries_shiohara_1080.png" alt="塩原(Superfriends・Guitar & Vocal)のコメント" loading="lazy" width="2160" height="2160">
  </figure>
</section>

<footer class="page-footer">
  <a href="index.html" class="back-link">← Back to Looisbos.com</a>
</footer>

<script>
const cards = document.querySelectorAll('.card');
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
      io.unobserve(entry.target);
    }
  });
}, { threshold: 0.15 });
cards.forEach(card => io.observe(card));
</script>

</body>
</html>
