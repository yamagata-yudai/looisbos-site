<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groceries — Recommended | Looisbos</title>
<meta name="description" content="Looisbos 4th EP『Groceries』のセルフライナーノーツと、アーティストからの推薦コメント">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0e0c08;
  --ink:#f4ede0;
  --ink-soft:#b3ac9d;
  --ink-dim:#8c8677;
  --gold:#d8c896;
  --line:rgba(244,237,224,0.18);
  --serif-en:'Cormorant Garamond','EB Garamond',Georgia,serif;
  --mincho:'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN',serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mincho);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.page-header{
  max-width:760px;
  margin:0 auto;
  padding:5rem 1.5rem 2rem;
  text-align:center;
}
.logo{
  font-family:var(--serif-en);
  font-style:italic;
  font-weight:600;
  font-size:1.5rem;
  letter-spacing:0.02em;
  color:var(--ink-soft);
  text-decoration:none;
}
.header-eyebrow{
  margin-top:2rem;
  font-family:var(--mono);
  font-size:0.68rem;
  letter-spacing:0.26em;
  color:var(--ink-dim);
  text-transform:uppercase;
}
.headline{
  font-family:var(--serif-en);
  font-style:italic;
  font-weight:500;
  font-size:clamp(2.8rem,8vw,4.4rem);
  margin-top:0.4rem;
  letter-spacing:-0.01em;
}
.sub{
  margin-top:1.1rem;
  font-size:0.9rem;
  color:var(--ink-soft);
  line-height:1.9;
}
.hint{
  margin-top:0.8rem;
  font-family:var(--mono);
  font-size:0.66rem;
  letter-spacing:0.14em;
  color:var(--ink-dim);
  text-transform:uppercase;
}
.divider{
  width:100%;
  max-width:1080px;
  margin:0 auto;
  border:none;
  border-top:1px solid var(--line);
}
.grid{
  max-width:820px;
  margin:2.5rem auto 0;
  padding:0 1.25rem 4rem;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:1.5rem 1.25rem;
}
.tile{
  display:flex;
  flex-direction:column;
  gap:0.7rem;
  background:none;
  border:none;
  padding:0;
  cursor:zoom-in;
  text-align:left;
  color:inherit;
  opacity:0;
  transform:translateY(20px);
  transition:opacity 0.7s ease, transform 0.7s ease;
}
.tile.is-visible{opacity:1;transform:translateY(0)}
.tile-frame{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border:1px solid var(--line);
}
.tile-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.5s ease, filter 0.4s ease;
  filter:brightness(0.92);
}
.tile:hover .tile-frame img,
.tile:focus-visible .tile-frame img{
  transform:scale(1.05);
  filter:brightness(1.05);
}
.tile-zoom{
  position:absolute;
  bottom:0.5rem;
  right:0.5rem;
  width:1.9rem;
  height:1.9rem;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(14,12,8,0.55);
  border:1px solid rgba(244,237,224,0.4);
  backdrop-filter:blur(3px);
  color:var(--ink);
}
.tile-zoom svg{width:0.95rem;height:0.95rem;display:block}
.tile-cap{line-height:1.35}
.tile-name{
  font-family:var(--serif-en);
  font-style:italic;
  font-size:1.1rem;
  color:var(--ink);
}
.tile-name.jp{font-family:var(--mincho);font-style:normal;font-weight:600;font-size:1rem}
.tile-role{
  font-family:var(--mono);
  font-size:0.62rem;
  letter-spacing:0.03em;
  color:var(--ink-dim);
  margin-top:0.15rem;
}
.page-footer{
  max-width:720px;
  margin:0 auto;
  padding:1rem 1.5rem 5rem;
  text-align:center;
}
.back-link{
  display:inline-block;
  font-family:var(--mono);
  font-size:0.72rem;
  letter-spacing:0.1em;
  color:var(--ink-soft);
  text-decoration:none;
  border:1px solid var(--line);
  padding:0.75rem 1.7rem;
  transition:color 0.2s, border-color 0.2s;
}
.back-link:hover{color:var(--ink);border-color:var(--ink)}

/* Lightbox */
.lightbox{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(6,5,3,0.94);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  padding:0;
}
.lightbox.open{display:flex;align-items:center;justify-content:center}
.lightbox.zoomed{align-items:flex-start;justify-content:flex-start}
.lightbox-img{
  display:block;
  max-width:96vw;
  max-height:94vh;
  margin:auto;
  cursor:zoom-in;
  box-shadow:0 20px 80px rgba(0,0,0,0.6);
}
.lightbox.zoomed .lightbox-img{
  max-width:none;
  max-height:none;
  width:min(1200px,max(760px,100vw));
  margin:0;
  cursor:zoom-out;
}
.lightbox-close{
  position:fixed;
  top:1rem;
  right:1.1rem;
  z-index:110;
  width:2.6rem;
  height:2.6rem;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(14,12,8,0.6);
  border:1px solid var(--line);
  color:var(--ink);
  font-size:1.4rem;
  line-height:1;
  cursor:pointer;
  backdrop-filter:blur(4px);
}
.lightbox-close:hover{border-color:var(--ink)}
.lightbox-hint{
  position:fixed;
  bottom:1rem;
  left:50%;
  transform:translateX(-50%);
  z-index:110;
  font-family:var(--mono);
  font-size:0.64rem;
  letter-spacing:0.14em;
  color:var(--ink-soft);
  text-transform:uppercase;
  background:rgba(14,12,8,0.55);
  padding:0.5rem 1rem;
  border:1px solid var(--line);
  pointer-events:none;
}
</style>
</head>
<body>

<header class="page-header">
  <a href="index.html" class="logo">Looisbos</a>
  <div class="header-eyebrow">4th EP · 2026 · 5 Tracks</div>
  <h1 class="headline">Groceries</h1>
  <p class="sub">バンド自身のライナーノーツと、『Groceries』に寄せられたアーティストたちからの推薦コメント。</p>
  <p class="hint">Tap a card to zoom &amp; read</p>
</header>

<hr class="divider">

<section class="grid" id="grid">

  <button class="tile" data-full="assets/images/comments/Looisbos_Groceries_gatta_1080.jpeg">
    <span class="tile-frame">
      <img src="assets/images/comments/thumbs/Looisbos_Groceries_gatta_1080.jpg" alt="Looisbos セルフライナーノーツ" loading="lazy">
      <span class="tile-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></span>
    </span>
    <span class="tile-cap">
      <span class="tile-name jp">Looisbos</span>

    </span>
  </button>

  <button class="tile" data-full="assets/images/comments/Looisbos_Groceries_yanagisawa_1080.png">
    <span class="tile-frame">
      <img src="assets/images/comments/thumbs/Looisbos_Groceries_yanagisawa_1080.jpg" alt="柳澤豊 のコメント" loading="lazy">
      <span class="tile-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></span>
    </span>
    <span class="tile-cap">
      <span class="tile-name jp">柳澤豊</span>
      <span class="tile-role">MONO NO AWARE / Jurassic Boys</span>
    </span>
  </button>

  <button class="tile" data-full="assets/images/comments/Looisbos_Groceries_hidematt_1080.png">
    <span class="tile-frame">
      <img src="assets/images/comments/thumbs/Looisbos_Groceries_hidematt_1080.jpg" alt="Hide Matt のコメント" loading="lazy">
      <span class="tile-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></span>
    </span>

  <button class="tile" data-full="assets/images/comments/Looisbos_Groceries_takuchan_1080.png">
    <span class="tile-frame">
      <img src="assets/images/comments/thumbs/Looisbos_Groceries_takuchan_1080.jpg" alt="takuchan のコメント" loading="lazy">
      <span class="tile-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></span>
    </span>

  <button class="tile" data-full="assets/images/comments/Looisbos_Groceries_shiohara_1080.png">
    <span class="tile-frame">
      <img src="assets/images/comments/thumbs/Looisbos_Groceries_shiohara_1080.jpg" alt="塩原 のコメント" loading="lazy">
      <span class="tile-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></span>

</section>

<footer class="page-footer">
  <a href="index.html" class="back-link">← Back to Looisbos.com</a>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="コメントカード拡大表示">
  <button class="lightbox-close" id="lbClose" aria-label="閉じる">×</button>
  <img class="lightbox-img" id="lbImg" src="" alt="">
  <span class="lightbox-hint" id="lbHint">Tap image to zoom · Esc to close</span>
</div>

<script>
// Scroll reveal
const tiles = document.querySelectorAll('.tile');
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('is-visible'); io.unobserve(e.target);} });
}, { threshold: 0.1 });
tiles.forEach(t => io.observe(t));

// Lightbox
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbClose = document.getElementById('lbClose');
const lbHint = document.getElementById('lbHint');
let lastFocus = null;

function openLightbox(full, alt){
  lastFocus = document.activeElement;
  lbImg.src = full;
  lbImg.alt = alt || '';
  lb.classList.remove('zoomed');
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  lbClose.focus();
}
function closeLightbox(){
  lb.classList.remove('open','zoomed');
  lbImg.src = '';
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
function toggleZoom(){
  const z = lb.classList.toggle('zoomed');
  if (z){ lb.scrollTop = 0; lb.scrollLeft = 0; }
  lbHint.style.display = z ? 'none' : '';
}

tiles.forEach(t => {
  t.addEventListener('click', () => {
    const img = t.querySelector('img');
    openLightbox(t.dataset.full, img ? img.alt : '');
  });
});
lbImg.addEventListener('click', toggleZoom);
lbClose.addEventListener('click', closeLightbox);
lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
});
</script>

</body>
